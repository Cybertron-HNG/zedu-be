name: PR scans

# Caller: the logic lives in zedu-hng/zedu-ci (pr-scans.yml), pinned by commit. This file sets the
# triggers, concurrency and token permissions. Keep the file name: other workflows look it up.
# Runs Semgrep (Go rules), ClamAV and the obfuscation scan over the PR's added lines.

on:
  pull_request:
    branches:
      - dev
      - central-staging
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions: {}

concurrency:
  group: pr-scans-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scans:
    name: PR scans
    if: github.repository == 'zedu-hng/zedu-be'
    permissions:
      contents: read
    uses: zedu-hng/zedu-ci/.github/workflows/pr-scans.yml@d631c20d55d9ae3ac2b199256812f748cda5616c
    with:
      # Semgrep is off pending a triage of its findings on dev (46 HTML-template false positives plus
      # 5 real). Empty configs/paths skip the scan; set the Go packs below to enable it again.
      semgrep_configs: ""
      semgrep_paths: ""
      clamav_exclude_dirs: vendor
