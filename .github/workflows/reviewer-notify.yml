name: Reviewer notify

# Caller: the logic lives in zedu-hng/zedu-ci (reviewer-notify.yml), pinned by commit. This file sets the
# triggers, concurrency and token permissions. Keep the file name: other workflows look it up.
# Keeps the ready-for-review queue: lead-approved PRs with a green Build, 3 unclaimed per team.
# zedu-be has no Fork build, so build_context is the "Build" status posted by PR Review comment.

on:
  pull_request_target:
    branches:
      - dev
      - central-staging
    types:
      - ready_for_review
      - labeled
      - unlabeled
      - synchronize
      - reopened
      - converted_to_draft
      - closed
  workflow_run:
    workflows: ["Lead approval", "PR Review comment"]
    types:
      - completed
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions: {}

# Every run re-evaluates the whole queue, so runs share one group without cancelling.
concurrency:
  group: reviewer-notify
  cancel-in-progress: false

jobs:
  notify:
    name: Reviewer notify
    if: vars.IS_BOOTCAMP == 'true'
    permissions:
      contents: read
      pull-requests: write
      statuses: read
    uses: zedu-hng/zedu-ci/.github/workflows/reviewer-notify.yml@d631c20d55d9ae3ac2b199256812f748cda5616c
    with:
      build_context: Build
