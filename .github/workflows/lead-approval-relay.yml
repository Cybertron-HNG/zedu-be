name: Lead approval relay

# Caller: the logic lives in zedu-hng/zedu-ci (lead-approval-relay.yml), pinned by commit. This file sets the
# triggers, concurrency and token permissions. Keep the file name: other workflows look it up.
# Re-checks Lead approved right after a review (see lead-approval-review.yml).

on:
  workflow_run:
    workflows: ["Lead approval review"]
    types:
      - completed

permissions: {}

jobs:
  relay:
    name: Lead approval relay
    if: vars.IS_BOOTCAMP == 'true'
    permissions:
      actions: write
      pull-requests: read
    uses: zedu-hng/zedu-ci/.github/workflows/lead-approval-relay.yml@4d3af2e00864e531a3493986e418dac84c3b1454
