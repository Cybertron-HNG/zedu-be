name: Internal checks

# zedu-hng/zedu-be is a fork of zeduchat/zedu-be, so GitHub never runs pull_request (or
# pull_request_target) workflows when a PR's head branch lives in this repository itself. Every run of
# "PR checks" / "PR scans" comes from an external fork, so an internal branch pushed straight to this
# repo is never checked. This companion runs the same core checks on a pushed branch and posts the
# results as commit statuses (same contexts as the fork suite). Fork PRs are unaffected: this workflow
# never runs for their head branches, which live in another repo.

on:
  push:
    branches-ignore:
      - dev
      - central-staging
      - staging
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: internal-checks-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  checks:
    name: Internal checks
    if: github.repository == 'zedu-hng/zedu-be'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      statuses: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SHA: ${{ github.sha }}
      BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # Base is the open PR's base when one exists (an internal PR), otherwise dev.
      - name: Resolve base
        id: ctx
        run: |
          owner="${REPO%%/*}"
          base=dev
          pr=$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json number,headRepositoryOwner \
            | jq -r --arg owner "$owner" 'map(select(.headRepositoryOwner.login == $owner))[0].number // empty')
          if [ -n "$pr" ]; then
            base=$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json baseRefName,headRepositoryOwner \
              | jq -r --arg owner "$owner" 'map(select(.headRepositoryOwner.login == $owner))[0].baseRefName')
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          git fetch -q --no-tags origin "$base"
          echo "Checked branch '$BRANCH' against '$base' (PR: ${pr:-none})."

      - name: File policy
        id: file_policy
        continue-on-error: true
        env:
          BASE: ${{ steps.ctx.outputs.base }}
        run: bash .github/scripts/verify-changed-files.sh "origin/$BASE" HEAD

      - name: Gitleaks
        id: gitleaks
        continue-on-error: true
        run: |
          GITLEAKS_VERSION="8.24.2"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" detect --source . --no-git --config .gitleaks.toml --redact --no-banner

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Malware heuristics
        id: heuristics
        continue-on-error: true
        run: node .github/scripts/scan-malware.mjs

      - name: Install dependencies
        id: install
        run: go mod download

      - name: Commit messages
        id: commitlint
        if: steps.install.outcome == 'success'
        continue-on-error: true
        env:
          BASE: ${{ steps.ctx.outputs.base }}
        run: npx --yes -p @commitlint/cli@19 commitlint --from "$(git merge-base "origin/$BASE" HEAD)" --to HEAD --verbose

      # Only the files the branch changes: the repo has legacy unformatted files, so a whole-tree
      # gofmt would fail every push until someone reformats it.
      - name: Format
        id: format
        if: steps.install.outcome == 'success'
        continue-on-error: true
        env:
          BASE: ${{ steps.ctx.outputs.base }}
        run: |
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "origin/$BASE...HEAD" -- '*.go' | grep -v '^vendor/' || true)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed Go files; nothing to format-check."
            exit 0
          fi
          unformatted=$(gofmt -l "${files[@]}")
          if [ -n "$unformatted" ]; then
            echo "::error::These changed files are not gofmt-clean:"
            printf '%s\n' "$unformatted"
            exit 1
          fi

      - name: Go vet
        id: vet
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: go vet ./...

      - name: Build
        id: build
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: go build ./...

      - name: PR review
        id: review
        if: steps.install.outcome == 'success'
        continue-on-error: true
        env:
          BASE: ${{ steps.ctx.outputs.base }}
        run: |
          node .github/scripts/pr-review/run.mjs \
            --base "origin/$BASE" \
            --head HEAD \
            --config .github/pr-review.config.json \
            --output review-report.json

      # Publish each result as a commit status on the head commit, using the same contexts as the fork
      # suite so an internal PR shows the same checks (and branch protection, if any, can require them).
      - name: Results
        if: always()
        env:
          FILE_POLICY: ${{ steps.file_policy.outcome }}
          GITLEAKS: ${{ steps.gitleaks.outcome }}
          HEURISTICS: ${{ steps.heuristics.outcome }}
          INSTALL: ${{ steps.install.outcome }}
          COMMITLINT: ${{ steps.commitlint.outcome }}
          FORMAT: ${{ steps.format.outcome }}
          VET: ${{ steps.vet.outcome }}
          BUILD: ${{ steps.build.outcome }}
          REVIEW: ${{ steps.review.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          failed=0
          post() { # context outcome
            local state desc
            case "$2" in
              success) state=success; desc="Passed" ;;
              skipped)
                if [ "$INSTALL" = failure ]; then desc="Not run: dependency install failed"
                else desc="Not run"; fi
                state=failure; failed=$((failed + 1)) ;;
              *) state=failure; desc="${2:-not run}"; failed=$((failed + 1)) ;;
            esac
            jq -n --arg state "$state" --arg context "$1" --arg description "$desc" --arg url "$RUN_URL" \
              '{state: $state, context: $context, description: $description, target_url: $url}' \
              | gh api -X POST "repos/$REPO/statuses/$SHA" --input - >/dev/null
            echo "| $1 | $state: $desc |" >> "$GITHUB_STEP_SUMMARY"
          }
          {
            echo "### Internal checks for \`${SHA:0:7}\` on \`$BRANCH\`"
            echo
            echo "| Check | Result |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          post "File policy" "$FILE_POLICY"
          post "Gitleaks" "$GITLEAKS"
          post "Malware heuristics" "$HEURISTICS"
          post "Commit messages" "$COMMITLINT"
          post "Format" "$FORMAT"
          post "Go vet" "$VET"
          post "Build" "$BUILD"
          post "PR review" "$REVIEW"
          [ "$failed" = 0 ] || { echo "::error::$failed check(s) failed; see the summary above."; exit 1; }
