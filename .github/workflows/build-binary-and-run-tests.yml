name: Build Golang Binary and Run Tests

on:
  pull_request:
    branches:
      - dev
      - central-staging
  push:
    branches:
      - testing

permissions:
  contents: read

concurrency:
  group: build-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate swagger.yaml
        uses: GrantBirki/json-yaml-validate@v3.1.0
        with:
          files: ./static/swagger.yaml

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Start dependency services
        run: |
          docker compose -f docker-compose.dev.yml up -d postgres redis minio centrifugo
          docker run -d --name elasticsearch-ci -p 9200:9200 \
            -e discovery.type=single-node \
            -e xpack.security.enabled=false \
            -e ES_JAVA_OPTS="-Xms512m -Xmx512m" \
            elastic/elasticsearch:8.11.0

      - name: Wait for dependencies
        run: |
          wait_for() {
            local name="$1" attempts="$2" interval="$3"
            shift 3
            for i in $(seq 1 "${attempts}"); do
              if "$@"; then
                echo "${name} is ready"
                return 0
              fi
              sleep "${interval}"
            done
            echo "::error::${name} did not become ready"
            return 1
          }

          wait_for postgres 60 2 docker compose -f docker-compose.dev.yml exec -T postgres pg_isready -U postgres
          wait_for redis 60 2 docker compose -f docker-compose.dev.yml exec -T redis redis-cli ping
          wait_for elasticsearch 60 3 curl -sf --max-time 5 -o /dev/null http://localhost:9200
          wait_for minio 60 2 curl -sf --max-time 5 -o /dev/null http://localhost:9000/minio/health/live
          wait_for centrifugo 60 2 curl -sf --max-time 5 -o /dev/null http://localhost:8000/health

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Generate test database name
        run: echo "TEST_DB_NAME=telex_be_test_${GITHUB_RUN_NUMBER}_$(date +%s)" >> "$GITHUB_ENV"

      - name: Write app.env
        run: |
          cp app-sample.env app.env
          sed -i "s|^DB_HOST=.*|DB_HOST=localhost|" app.env
          sed -i "s|^DB_PORT=.*|DB_PORT=5432|" app.env
          sed -i "s|^DB_NAME=.*|DB_NAME=${TEST_DB_NAME}|" app.env
          sed -i "s|^USERNAME=.*|USERNAME=postgres|" app.env
          sed -i "s|^PASSWORD=.*|PASSWORD=password|" app.env
          sed -i "s|^SSLMODE=.*|SSLMODE=disable|" app.env
          sed -i "s|^TEST_DB_HOST=.*|TEST_DB_HOST=localhost|" app.env
          sed -i "s|^TEST_DB_PORT=.*|TEST_DB_PORT=5432|" app.env
          sed -i "s|^TEST_DB_NAME=.*|TEST_DB_NAME=${TEST_DB_NAME}|" app.env
          sed -i "s|^TEST_USERNAME=.*|TEST_USERNAME=postgres|" app.env
          sed -i "s|^TEST_PASSWORD=.*|TEST_PASSWORD=password|" app.env
          sed -i "s|^TEST_SSLMODE=.*|TEST_SSLMODE=disable|" app.env
          sed -i "s|^SERVER_ENCKEY=.*|SERVER_ENCKEY=someGeneric32LengthKeyLikeThat12|" app.env
          sed -i "s|^REDIS_HOST=.*|REDIS_HOST=localhost|" app.env
          sed -i "s|^REDIS_PORT=.*|REDIS_PORT=6379|" app.env
          sed -i "s|^ELASTIC_URL=.*|ELASTIC_URL=http://localhost:9200|" app.env
          sed -i "s|^MINIO_ENDPOINT=.*|MINIO_ENDPOINT=localhost:9000|" app.env
          sed -i "s|^MINIO_USE_SSL=.*|MINIO_USE_SSL=false|" app.env
          sed -i "s|^BUCKET_NAME=.*|BUCKET_NAME=dev-bucket|" app.env
          sed -i "s|^BUCKET_ACCESS_KEY=.*|BUCKET_ACCESS_KEY=minio_access_key|" app.env
          sed -i "s|^BUKCET_SECRET_KEY=.*|BUKCET_SECRET_KEY=minio_secret_key|" app.env
          sed -i "s|^CENTRIFUGE_URL=.*|CENTRIFUGE_URL=http://localhost:8000|" app.env
          sed -i "s|^CENTRIFUGE_API_KEY=.*|CENTRIFUGE_API_KEY=generic_centrifuge_api_key|" app.env
          sed -i "s|^HMAC_SECRET=.*|HMAC_SECRET=DoHardThingsGenericSecret|" app.env
          sed -i "s|^AGORA_APP_ID=.*|AGORA_APP_ID=0123456789abcdef0123456789abcdef|" app.env
          sed -i "s|^AGORA_APP_CERTIFICATE=.*|AGORA_APP_CERTIFICATE=0123456789abcdef0123456789abcdef|" app.env
          sed -i "s|^STRIPE_KEY=.*|STRIPE_KEY=|" app.env
          echo "DB_URL=postgresql://postgres:password@localhost:5432/${TEST_DB_NAME}?sslmode=disable" >> app.env

      - name: Create test database
        run: |
          PGPASSWORD=password psql -h localhost -U postgres -d postgres \
            -c "CREATE DATABASE \"${TEST_DB_NAME}\";"

      - name: Build
        run: go build ./...

      - name: Run tests
        run: |
          mkdir -p logs tests/logs
          mkdir -p "${RUNNER_TEMP}/gotmp"
          export GOTMPDIR="${RUNNER_TEMP}/gotmp"
          go test -v -p 1 ./tests/... -timeout 600s

      - name: Stop dependency services
        if: always()
        run: |
          docker compose -f docker-compose.dev.yml down -v
          docker rm -f elasticsearch-ci || true
