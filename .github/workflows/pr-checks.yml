name: PR checks

# Caller: the logic lives in zedu-hng/zedu-ci (pr-checks-go.yml), pinned by commit. This file sets the
# triggers, concurrency and token permissions. Keep the file name: pr-review-recheck.yml looks the
# runs up by it, and pr-review-comment.yml triggers on the workflow name "PR checks".
# One job: file policy, Gitleaks, malware heuristics, commitlint, govulncheck, gofmt, go vet, build,
# PR review. Semgrep, ClamAV and the obfuscation scan run in pr-scans.yml.

on:
  pull_request:
    branches:
      - dev
      - central-staging
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions: {}

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    name: PR checks
    if: github.repository == 'zedu-hng/zedu-be'
    permissions:
      contents: read
    uses: zedu-hng/zedu-ci/.github/workflows/pr-checks-go.yml@d631c20d55d9ae3ac2b199256812f748cda5616c
    with:
      tests: false
      audit: false
