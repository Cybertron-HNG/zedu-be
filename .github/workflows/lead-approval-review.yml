name: Lead approval review

# Trigger only. A review on a fork PR runs with a read-only token and can't set the Lead approved
# status, so this does nothing itself; lead-approval-relay.yml (trusted, workflow_run) re-checks the
# PR as soon as this finishes, instead of waiting for Lead approval's cron, which GitHub often drops.

# The run name carries the PR number, so the relay can find the PR even when the run's commit no
# longer matches it (the base moved, changing the test-merge commit).
run-name: "Lead approval review #${{ github.event.pull_request.number }}"

on:
  pull_request_review:
    types:
      - submitted
      - edited
      - dismissed

permissions:
  contents: read

jobs:
  noted:
    name: Note review
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          PR: ${{ github.event.pull_request.number }}
        run: echo "Review on PR $PR; lead-approval-relay.yml re-checks it."
