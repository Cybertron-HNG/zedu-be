name: PR rules

# Caller: the logic lives in zedu-hng/zedu-ci (pr-rules.yml), pinned by commit. This file sets the
# triggers, concurrency and token permissions. Keep the file name: other workflows look it up.
# Branch name, Single author, Protected files, Size, PR title and PR template, each a commit status.

on:
  pull_request_target:
    branches:
      - dev
      - central-staging
    types:
      - opened
      - synchronize
      - reopened
      - edited
      - labeled
      - unlabeled

permissions: {}

concurrency:
  group: pr-rules-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  rules:
    name: PR rules
    if: vars.IS_BOOTCAMP == 'true'
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    uses: zedu-hng/zedu-ci/.github/workflows/pr-rules.yml@26ed37d4f4d50007783fbc3e9213d6ab39c39309
    with:
      protected: '^(\.github/|AGENTS\.md$|AGENT\.md$|CONTRIBUTING\.md$|go\.mod$|go\.sum$|Makefile$|Dockerfile$|Dockerfile\.dev$|docker-compose.*\.ya?ml$|\.air\.toml$|app-sample\.env$|commitlint\.config\.|\.gitleaks\.toml$|\.semgrepignore$|internal/config/)'
      size_exclude: '(^|/)go\.sum$'
      template: .github/pull_request_template.md
      # Teams may open a batch/consolidated PR from their fork, so a PR may combine a team's work.
      # Both rules stay in place (still posted as statuses); set a line to true (or delete it) to
      # enforce it again.
      enforce_single_author: false
      enforce_size: false
