title = "gitleaks config"

[extend]
# --config replaces the built-in ruleset unless this is set.
# Without it, this file had zero detection rules so hardcoded keys never failed.
useDefault = true

[[rules]]
id = "hardcoded-source-secret"
description = "High-entropy string assigned in source, regardless of variable name"
# Covers Go short declarations (name := "value") as well as const/let/var.
regex = '''(?i)(?:(?:const|let|var)\s+[A-Za-z_][\w]*\s*=\s*|[A-Za-z_][\w]*\s*:=\s*)['"]([A-Za-z0-9+=_.-]{20,})['"]'''
entropy = 3.5
keywords = [
  "const",
  "let",
  "var",
  ":=",
]

  # Non-secret literals (queue task names, a character-set fixture) and test data that the Go
  # short-declaration form would otherwise flag. Scoped to this rule, so the default rules still
  # scan these files.
  [[rules.allowlists]]
  description = "Non-secret Go string literals"
  regexes = [
    '''telex_queue_processor''',
    '''abcdefghijklmnopqrstuvwxyz''',
  ]
  paths = [
    '''(^|/)tests/''',
  ]

[allowlist]
description = "Allow known test fixtures and generated files"
paths = [
  '''integration\.json''',
  '''(?:^|/)\.github/''',
  '''(?:^|/)go\.sum$''',
  '''app-sample\.env$''',
  '''static/swagger\.yaml$''',
]
